name: Godot checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gdscript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: Parse all GDScript files
        run: find freedom-knight -name "*.gd" -print0 | xargs -0 gdparse
      - name: Test matrix exists
        run: test -f docs/pruebas.md